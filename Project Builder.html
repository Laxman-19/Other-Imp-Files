<style id="upb-style">

body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;font-weight:600;font-size:14.5px;line-height:1.2;color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);border-radius:9px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s}

.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#26354C;border-color:#26354C}
.btn.lg{padding:13px 20px;font-size:15.5px}
.btn.sm{padding:7px 11px;font-size:13.5px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--graphite)}
.btn.quiet:hover{background:var(--wash);color:var(--ink)}

.btn:focus-visible,.link:focus-visible,.drop:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.stack{display:grid;gap:18px}
.muted{color:var(--graphite)}
.small{font-size:13.5px}

.drop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:38px 20px 32px;background:var(--wash);border:1.5px dashed var(--rule-2);border-radius:12px;cursor:pointer;transition:border-color .15s,background-color .15s}

.proj .k{font-size:13px;color:var(--graphite)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;border:1px solid var(--rule);border-radius:var(--r-md)}

.stats>div+div{border-left:1px solid var(--rule)}

.alert>.i{font-size:19px;margin-top:1px}
.alert-body{flex:1;min-width:0;display:grid;gap:4px}
.alert-body strong{font-weight:650}
.alert-body p{margin:0}
.alert.error{background:var(--err-wash);border-color:#F2C4BF;color:#6E1A13}
.alert.error>.i{color:var(--err)}
.alert.warn{background:var(--warn-wash);border-color:#EFD39C;color:#573700}

.alert.ok{background:var(--ok-wash);border-color:#B9DFCC;color:#0A4D39}

.alert .check{margin-top:6px;color:inherit}
.alert .btn{justify-self:start;margin-top:6px}

.issues ul{list-style:none;margin:8px 0 0;padding:0;max-height:220px;overflow:auto}
.issues li{display:grid;gap:1px;padding:7px 0;border-top:1px solid rgba(23,33,49,.08)}
.issues code{font-size:12.5px;word-break:break-all}

.tree-scroll{max-height:340px;overflow:auto;padding:6px 6px 8px}
.tree{list-style:none;margin:0;padding:0 0 0 16px}
.tree-scroll>.tree{padding-left:0}
.row{display:flex;align-items:center;gap:7px;min-width:0;padding:3px 8px 3px 4px;border-radius:6px;font:13px/1.5 var(--f-mono)}
.row:hover{background:var(--wash)}
summary.row{cursor:pointer;list-style:none}
summary.row::-webkit-details-marker{display:none}
.row.leaf::before{content:"";width:1.15em;flex:none}
.row .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
summary.row .n{font-weight:600}
.row .count,.row .size{color:var(--faint);font:12px/1.5 var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}

.row .size{min-width:64px;text-align:right}
.row .n+.size{margin-left:auto}
.chev{color:var(--faint);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.k-dir{color:#66758C}.k-code{color:#2F55C9}.k-img{color:#0D7655}.k-font{color:#7E4CC2}.k-media{color:#B0502A}.k-doc{color:#596476}.k-arc{color:#8A5700}.k-other{color:#8A94A5}
.progress{display:grid;gap:12px;padding:6px 0 2px}
.p-head{display:flex;align-items:center;gap:10px;font-size:16px}
.spinner{width:16px;height:16px;flex:none;border:2px solid var(--rule-2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:8px;background:#E2E7EE;border-radius:99px;overflow:hidden}
.bar>i{display:block;width:0;height:100%;background:var(--ink);border-radius:inherit;transition:width .2s ease-out}
.p-line{margin:0;font-size:14px;font-variant-numeric:tabular-nums;min-height:1.4em}
.steps{list-style:none;display:grid;gap:7px;margin:4px 0 0;padding:0;font-size:14px;color:var(--faint)}
.steps li{display:flex;align-items:center;gap:10px}
.steps .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.steps li.active{color:var(--ink);font-weight:600}
.steps li.active .dot{background:currentColor;box-shadow:0 0 0 3px rgba(23,33,49,.12)}
.steps li.done{color:var(--ok)}
.steps li.done .dot{background:currentColor}
.done-head{display:flex;align-items:center;gap:14px}
.done-head h3{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:-.01em}
.badge{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;font-size:22px}
.badge.ok{background:var(--ok);color:#fff}
.badge.ok svg{stroke-width:2.6}
.badge.warn{background:var(--warn-wash);color:var(--warn);border:1px solid #EFD39C}
.filecard{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--wash);border:1px solid var(--rule);border-radius:var(--r-md)}
.filecard>.i{font-size:30px;color:var(--ink)}
.fname{font:600 14px/1.35 var(--f-mono);word-break:break-all}
.verify{display:flex;align-items:center;gap:8px;margin:0;font-weight:650;font-variant-numeric:tabular-nums}
.verify.ok{color:var(--ok)}
.verify.bad{color:var(--warn)}
.verify .i{font-size:19px}
.fp{padding:14px 16px 12px;border:1px solid var(--rule);border-radius:var(--r-md)}
.fp-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:10px;font-size:13px;color:var(--graphite)}
.fp-hex{font:600 13px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink)}
.fp-bars{display:block;width:100%;height:40px;color:var(--ink)}
.fp-bars rect{transform-box:fill-box;transform-origin:50% 100%}
.fp-note{margin:10px 0 0;font-size:12.5px;color:var(--graphite)}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:no-preference){.fp-bars.animate rect{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}.bar>i,.chev,.btn,.drop{transition:none}}
.foot{max-width:760px;margin:40px auto 0;text-align:center;font-size:13px;color:var(--graphite)}
.foot p{margin:0}
@media (max-width:940px){.cards{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.card-head,.card-body{padding-left:18px;padding-right:18px}.stats dd{font-size:19px}.actions>.btn{flex:1 1 100%}.row .count{display:none}}

<script id="upb-app">
(() => {
'use strict';
/*
  Universal Project Builder 1.0. Package format "universal-project-package" 1.0.
  A package is one HTML file containing:
    1. A prologue comment that identifies the format.
    2. A copy of this application (style, markup, script), so a package can restore itself when opened.
    3. A JSON manifest inside an inert script element of type application/json.
    4. One inert script element per project file. Valid UTF-8 text is stored as a JSON string literal,
       everything else as Base64. Every "<" in stored data is escaped as \u003c, so stored content can never
       close an element, open a comment or be parsed as markup. Nothing stored is ever executed.
  Each manifest entry records path, type, MIME type, size, encoding, SHA-256, CRC-32 and the byte offset and
  length of its stored data, counted from the "<" that ends the manifest. That region has no line breaks,
  so line-ending conversion of the package cannot shift it.
*/
const APP_NAME = 'Universal Project Builder';
const APP_VERSION = '1.0';
const FORMAT = 'universal-project-package';
const FORMAT_VERSION = '1.0';
const LT = '\x3c';
const PROLOGUE_MARK = LT + '!-- ' + FORMAT + ' ';
const MANIFEST_TAG = LT + 'script type="application/json" id="upb-manifest">';
const BLOCK_OPEN = LT + 'script type="application/x-upb-file" id="';
const END_SCRIPT = LT + '/script>';
const WHOLE_READ_LIMIT = 256 * 1024 * 1024;
const NOSCRIPT = '<noscript><p style="font:16px/1.5 system-ui,sans-serif;padding:24px">This project package needs JavaScript to restore its files. You can also upload it to project-builder.html.</p></noscript>';

const enc = new TextEncoder();
const dec = new TextDecoder('utf-8');
const decStrict = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true });
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
const byName = (a, b) => collator.compare(a.name, b.name);

// Pristine copies of this app. Every package embeds them so it can restore itself when opened.
const SELF = {
  style: document.getElementById('upb-style').textContent,
  shell: document.getElementById('upb-shell').innerHTML,
  code: document.getElementById('upb-app').textContent
};

/* ---------- errors and cancellable jobs ---------- */
class UserError extends Error { constructor(message, detail, items) { super(message); this.detail = detail || ''; this.items = items; } }
class PackageError extends Error { constructor(message, detail) { super(message); this.detail = detail || ''; } }
class Cancelled extends Error {}
const notPackage = () => new PackageError('This is not a valid Universal Project package.', 'Choose an HTML file that was created with the Universal Project Builder.');
const damaged = (why) => new PackageError('This project package is damaged.', why);
const newJob = () => ({ cancelled: false, check() { if (this.cancelled) throw new Cancelled('Cancelled'); } });
const describe = (e) => (e && e.name === 'RangeError') ? 'The browser ran out of memory. Try splitting the project into smaller ZIPs.' : (e && e.message) || String(e);

/* ---------- small utilities ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const dv = (u8) => new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
const readBlob = async (blob, a, b) => new Uint8Array(await blob.slice(a, b).arrayBuffer());
const baseName = (p) => p.slice(p.lastIndexOf('/') + 1);
const parentOf = (p) => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); };
const extOf = (p) => { const b = baseName(p), i = b.lastIndexOf('.'); return i > 0 ? b.slice(i + 1).toLowerCase() : ''; };
const pl = (n, word) => n.toLocaleString() + ' ' + word + (n === 1 ? '' : 's');
const isUint = (n) => Number.isSafeInteger(n) && n >= 0;
const isSafeName = (s) => typeof s === 'string' && s.length > 0 && s.length <= 255 && s !== '.' && s !== '..' && !/[\/\\\u0000]/.test(s);
const isSafePath = (p) => typeof p === 'string' && p.split('/').every(isSafeName);
const escHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  const units = ['KB', 'MB', 'GB', 'TB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
  return (n >= 100 ? n.toFixed(0) : n.toFixed(1).replace(/\.0$/, '')) + ' ' + units[i];
}
function safeName(s) {
  const t = String(s).replace(/[<>:"\/\\|?*\u0000-\u001f]/g, '_').replace(/[. ]+$/, '').trim();
  return t || 'project';
}
function findBytes(hay, str, from) {
  const n = enc.encode(str);
  for (let i = hay.indexOf(n[0], from || 0); i !== -1 && i + n.length <= hay.length; i = hay.indexOf(n[0], i + 1)) {
    let k = 1;
    while (k < n.length && hay[i + k] === n[k]) k++;
    if (k === n.length) return i;
  }
  return -1;
}
let lastYield = 0;
async function tick() {
  if (performance.now() - lastYield > 30) { await new Promise((r) => setTimeout(r, 0)); lastYield = performance.now(); }
}
async function pool(count, limit, fn) {
  let next = 0;
  const worker = async () => { while (next < count) await fn(next++); };
  await Promise.all(Array.from({ length: Math.min(limit, count) }, worker));
}

function dropZone(o) {

  input.addEventListener('change', () => { const f = input.files && input.files[0]; input.value = ''; if (f) o.onFile(f); });

function progressView(title, steps, onCancel) {

}

async function onZip(file) {

    h('div', { class: 'actions' },
      h('button', { class: 'btn', type: 'button', onclick: onExtract }, icon('folderOut'), 'Extract again'),
      h('button', { class: 'btn', type: 'button', onclick: onDownloadZip }, icon('download'), 'Download ZIP'),
      h('button', { class: 'btn quiet', type: 'button', onclick: () => { X.note = null; X.state = 'ready'; renderExtract(); } }, 'Back to package')));
}
async function onPackageFile(file) {
  if (X.state === 'busy') return;
  if (!/\.html?$/i.test(file.name)) {
    X.state = 'idle';
    X.error = { title: 'Please choose an .html file.', detail: /\.zip$/i.test(file.name) ? 'To package a ZIP, use Create Project File.' : `“${file.name}” is not a project package.` };
    return renderExtract();
  }
  resetExtractData();
  X.state = 'busy';
  const job = X.job = newJob();
  const pv = progressView('Reading package…', null, () => { job.cancelled = true; });
  show('extract', pv.el);
  pv.set(0, 'Checking the package…', fmtBytes(file.size), true);
  setBusy(1);
  try {
    const pkg = await openPackageBlob(file, file.name);
    await loadPackage(pkg, job, pv);
  } catch (e) {
    X.state = 'idle'; X.pkg = null;
    if (!(e instanceof Cancelled)) X.error = e instanceof PackageError ? { title: e.message, detail: e.detail } : { title: 'This package could not be read.', detail: describe(e) };
  } finally { setBusy(-1); }
  renderExtract();
}
async function loadPackage(pkg, job, pv) {
  const v = await verifyPackage(pkg, job, (d, t) => pv.set(t ? d / t : 1, `Verifying files… ${d.toLocaleString()} / ${t.toLocaleString()}`, 'Checking every file against its SHA-256 checksum', d === t));
  X.pkg = pkg; X.verify = v; X.fp = await fingerprint(pkg.manifest.files, pkg.manifest.folders); X.state = 'ready';
  announce(v.failed.length ? 'Package loaded. Some files failed verification.' : 'Package loaded and verified.');
}
async function onExtract() {
  if (!X.pkg) return;
  let dest;
  try { dest = await window.showDirectoryPicker({ id: 'upb-extract', mode: 'readwrite' }); }
  catch (e) {
    if (e && e.name === 'AbortError') return;
    X.note = { kind: 'error', title: 'The folder picker could not be opened.', detail: e && e.name === 'SecurityError' ? 'This browser blocked folder access here, for example inside an embedded preview. Open project-builder.html directly from your computer in Chrome or Edge, or use Download ZIP.' : describe(e) };
    X.state = 'ready'; return renderExtract();
  }
  const name = X.pkg.manifest.rootFolder;
  try {
    await dest.getDirectoryHandle(name);
    X.dest = dest; X.state = 'confirm'; return renderExtract();
  } catch (e) {
    if (e && e.name === 'TypeMismatchError') { X.note = { kind: 'error', title: `“${dest.name}” already contains a file named “${name}”.`, detail: 'Choose a different destination folder.' }; X.state = 'ready'; return renderExtract(); }
    if (!e || e.name !== 'NotFoundError') { X.note = { kind: 'error', title: 'The destination folder could not be used.', detail: fsMessage(e) }; X.state = 'ready'; return renderExtract(); }
  }
  runExtract(dest);
}
async function runExtract(dest) {
  const m = X.pkg.manifest;
  X.state = 'busy'; X.note = null; X.dest = null;
  const job = X.job = newJob();
  const pv = progressView('Extracting project…', null, () => { job.cancelled = true; });
  show('extract', pv.el);
  pv.set(0, `0 / ${m.files.length.toLocaleString()} files`, `Writing to ${dest.name}/${m.rootFolder}`, true);
  setBusy(1);
  try {
    X.result = await extractToFolder(X.pkg, dest, job, (d, t) => pv.set(t ? d / t : 1, `${d.toLocaleString()} / ${t.toLocaleString()} files`, null, d === t));
    X.state = 'extracted';
    announce(X.result.cancelled ? 'Extraction cancelled.' : 'Project extracted.');
  } catch (e) {
    X.state = 'ready';
    X.note = { kind: 'error', title: 'The project could not be extracted.', detail: fsMessage(e) };
  } finally { setBusy(-1); }
  renderExtract();
}
async function onDownloadZip() {
  if (!X.pkg || X.state === 'busy') return;
  const back = X.state === 'extracted' ? 'extracted' : 'ready';
  const job = X.job = newJob();
  const pv = progressView('Building ZIP…', null, () => { job.cancelled = true; });
  X.state = 'busy';
  show('extract', pv.el);
  setBusy(1);
  try {
    const blob = await buildZip(X.pkg, job, (d, t) => pv.set(t ? d / t : 1, `${d.toLocaleString()} / ${t.toLocaleString()} files`, 'Text files are compressed; images and media are stored as-is', d === t));
    const m = X.pkg.manifest;
    let name = safeName(m.sourceZip || m.projectName);
    if (!/\.zip$/i.test(name)) name += '.zip';
    if (X.zip) URL.revokeObjectURL(X.zip.url);
    X.zip = { url: URL.createObjectURL(blob), name, size: blob.size };
    saveAs(X.zip.url, name);
    X.note = { kind: 'ok', title: `${name} is ready (${fmtBytes(blob.size)}).`, detail: 'The download should start on its own. If it does not, use the button below.', extra: h('a', { class: 'btn sm', href: X.zip.url, download: name }, icon('download'), 'Download ZIP again') };
    announce('ZIP ready.');
  } catch (e) {
    if (!(e instanceof Cancelled)) X.note = { kind: 'error', title: 'The ZIP could not be created.', detail: describe(e) };
  } finally { setBusy(-1); }
  X.state = back;
  renderExtract();
}

/* ---------- startup ---------- */
function showBanner(m) {
  const b = $('#pkg-banner');
  if (!b) return;
  b.replaceChildren(icon('box'), h('div', null,
    h('strong', null, `This file is a portable package of “${m.projectName}”.`),
    h('span', { class: 'muted' }, ` It holds ${pl(m.files.length, 'file')} in ${pl(m.folders.length, 'folder')}. Use Extract Project to restore them; nothing else is needed.`)));
  b.hidden = false;
}
async function loadEmbedded(pv) {
  const job = X.job = newJob();
  setBusy(1);
  try {
    const pkg = openEmbedded();
    if (!pkg) throw damaged('Its project data is missing. The file may have been cut short while downloading.');
    showBanner(pkg.manifest);
    await loadPackage(pkg, job, pv);
  } catch (e) {
    X.state = 'idle';
    X.error = e instanceof PackageError ? { title: e.message, detail: e.detail } : { title: 'This package could not be opened.', detail: describe(e) };
  } finally { setBusy(-1); }
  renderExtract();
}
function boot() {
  $('#app').append(document.getElementById('upb-shell').content.cloneNode(true));
  renderCreate();
  if (document.querySelector('meta[name="upb-package"]')) {
    document.body.classList.add('pkg-mode');
    X.state = 'busy';
    const pv = progressView('Opening project package…');
    pv.set(0, 'Loading the embedded project data…', '', true);
    show('extract', pv.el);
    const go = () => loadEmbedded(pv);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go, { once: true }); else go();
  } else renderExtract();
  // Files dropped outside a drop zone are routed by type instead of opening in the browser.
  window.addEventListener('dragover', (e) => { if (!(e.target.closest && e.target.closest('.drop'))) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; } });
  window.addEventListener('drop', (e) => {
    if (e.target.closest && e.target.closest('.drop')) return;
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (!f) return;
    if (/\.zip$/i.test(f.name) && C.state !== 'busy') onZip(f);
    else if (/\.html?$/i.test(f.name) && X.state !== 'busy') onPackageFile(f);
  });
}
boot();
})();
</script>
</body>
</html>
